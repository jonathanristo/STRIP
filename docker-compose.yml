volumes:
  nuclei-templates:
    external: true

services:
  subfinder:
    image: projectdiscovery/subfinder:latest
    environment:
      - XDG_CONFIG_HOME=/data/.config
    volumes: ["./data:/data"]
    working_dir: /data
  
  amass:
    image: caffix/amass:latest
    volumes: ["./data:/data"]
    working_dir: /data
  
  dnsx:
    image: projectdiscovery/dnsx:latest
    environment:
      - XDG_CONFIG_HOME=/data/.config
    volumes: ["./data:/data"]
    working_dir: /data
  
  asnmap:
    image: projectdiscovery/asnmap:latest
    environment:
      - XDG_CONFIG_HOME=/data/.config
      - PDCP_API_KEY=${PDCP_API_KEY:-}   # ProjectDiscovery Cloud key (read-only recon key, like subfinder's); required for seed expansion
    volumes: ["./data:/data"]
    working_dir: /data

  naabu:
    image: projectdiscovery/naabu:latest
    network_mode: host
    cap_add: ["NET_RAW","NET_ADMIN"]
    volumes: ["./data:/data"]
    working_dir: /data
  
  nmap:
    image: instrumentisto/nmap:latest
    network_mode: host
    cap_add: ["NET_RAW","NET_ADMIN"]
    volumes: ["./data:/data"]
    working_dir: /data
  
  httpx:
    image: projectdiscovery/httpx:latest
    environment:
      - XDG_CONFIG_HOME=/data/.config
    volumes: ["./data:/data"]
    working_dir: /data
  
  nuclei:
    image: projectdiscovery/nuclei:latest
    volumes: 
      - ./data:/data
      - nuclei-templates:/root/nuclei-templates
    working_dir: /data
  
  katana:
    image: projectdiscovery/katana:latest
    volumes: ["./data:/data"]
    working_dir: /data
    user: "1000:1000"
  
  testssl:
    image: drwetter/testssl.sh:latest
    platform: linux/amd64
    volumes: ["./data:/data"]
    working_dir: /data
  
  sslyze:
    image: nablac0d3/sslyze:latest
    volumes: ["./data:/data"]
    working_dir: /data

  gowitness:
    image: ghcr.io/sensepost/gowitness:latest
    platform: linux/amd64   # image is amd64-only: native on amd64 Linux/Windows, emulated on arm64
    volumes: ["./data:/data"]
    working_dir: /data

  # merge-phase helper: parses nmap.xml (stdlib XML, no host dependency) to keep product/version separate
  xmlparse:
    image: python:3-alpine
    volumes: ["./data:/data"]
    working_dir: /data
