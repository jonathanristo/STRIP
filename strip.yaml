brand: "STRIP"   # Surface Threat Reconnaissance & Identification Platform

inputs:
  domains_file: "./data/in/domains.txt"
  resolvers_file: "./data/in/resolvers.txt"  # optional

run:
  authorized_by: ""      # attestation recorded in run_manifest.json; blank → UNATTESTED

scan:
  naabu:
    top_ports: "1000"
    rate: 5000
  httpx:
    rate_limit: 400
  nuclei:
    severity_daily: "high,critical"
    severity_weekly: "medium,high,critical"
    rate_limit: 200
    concurrency: 50
  katana:
    enable: true       # crawls in the weekly sweep only (daily never crawls)
    depth: 2
    js_crawl: true
  tls:
    testssl: true       # deep TLS analysis → normalized into findings.ndjson (weak_tls)
    sslyze: false       # RAW SIDECAR ONLY — writes sslyze.json but is NOT normalized into the contract
                        # (testssl already feeds TLS findings); enable only if you want the raw artifact
  email:
    enable: true        # SPF/DMARC/DKIM/BIMI/MTA-STS/CAA posture via dnsx TXT/CAA (DNSSEC/DANE not covered)
    dkim_selectors: ["default", "google", "selector1", "selector2", "k1"]
  takeover:
    enable: true        # subdomain takeover: nuclei -tags takeover over CNAME'd hosts (confirmed|potential)

seed_expansion:
  enable: false               # OPT-IN: expand scan scope to the org's ASN CIDRs via asnmap (changes WHAT is scanned)
  exclusions: []              # CIDRs to exclude BEFORE scanning (e.g. shared hosting / third-party ranges)
  acknowledge_full_asn: false # allow expansion with an EMPTY exclusion list (whole ASN). asnmap needs PDCP_API_KEY

screenshots:
  enable: true
  gowitness:
    workers: 10
    delay: 0

output:
  root: "./data/out"
